;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two build environments share everything below:
;   station  - the real, mast mounted weather station (default)
;   testrig  - desktop test board. Identical behaviour EXCEPT cloud updates are
;              a "dry-run" (payloads printed to the console, nothing sent), it
;              uses its own hostname (yaows32-test.local), a fast wake cycle and
;              a longer OTA/console window.
;
; Build/flash:  pio run -e testrig -t upload   (or pick the env in the VS Code
;               PlatformIO status bar)

[platformio]
default_envs = station

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed=115200

upload_speed = 460800

; macOS: The next two lines need to be commented out if connecting via FTDI
; programmer. Leave them IN if directly connected to the ESP32 using USB.
;upload_port = /dev/cu.SLAB_USBtoUART
;monitor_port = /dev/cu.SLAB_USBtoUART

; Two 1.9MB OTA app slots (no SPIFFS needed). NOTE: changing the partition table
; requires ONE flash over USB - OTA cannot change it.
board_build.partitions = min_spiffs.csv

; Required for ElegantOTA to use the async web server
lib_compat_mode = strict
build_flags =
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
  ; Adafruit Unified Sensor - Abstraction layer required by all Adafruit libs
  Adafruit Unified Sensor

  ; Adafruit BME280 pressure & humidity sensor
  Adafruit BME280 Library

  ; Adafruit BMP085 pressure sensor
  Adafruit BMP085 Library

  ; Library for AM2315 I2C temp/humidity sensor
  adafruit/Adafruit AM2315 @ ~2.2.3

  ; Library for INA219 current/voltage sensor
  Adafruit INA219

  ; Library for DHT11/22 1-wire sensor temp/humidity sensor.
  DHT sensor library

  ; Library for DS1820 soil temperature sensor.
  DallasTemperature

  ; Library for MQTT functions
  knolleary/PubSubClient @ ^2.8

  paulstoffregen/OneWire @ ^2.3.8

  ; OTA web upload (maintenance window)
  esp32async/AsyncTCP @ 3.6.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  ayushsharma82/ElegantOTA @ 4.0.0

[env:station]

[env:testrig]
build_flags =
  ${env.build_flags}
  -DTEST_RIG=1
